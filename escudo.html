<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Shield Timer Test</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: transparent;
            font-family: 'Montserrat', Arial, sans-serif;
        }
        /* Contenedor principal del escudo - VISIBLE PARA PRUEBAS */
        #escudo-box {
            display: block !important; /* Forzamos que siempre se vea */
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.85);
            border: 3px solid #ff4757;
            border-radius: 12px;
            padding: 15px 25px;
            color: #fff;
            text-align: center;
            box-shadow: 0 0 15px rgba(255, 71, 87, 0.8);
        }
        .titulo {
            font-size: 16px;
            font-weight: bold;
            color: #ff6b81;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        .contador {
            font-size: 36px;
            font-weight: 900;
            color: #fff;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <div id="escudo-box">
        <div class="titulo">🛡️ MODO PRUEBA VISIBLE 🛡️</div>
        <div class="contador"><span id="tiempo">60</span>s</div>
    </div>

    <script>
        // Conexión WebSocket al servidor local de Streamer.bot (puerto 8080)
        const ws = new WebSocket("ws://127.0.0.1:8080/");

        ws.onopen = () => {
            console.log("Conectado a Streamer.bot exitosamente.");
        };

        ws.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                
                if (data.action === "actualizarEscudo") {
                    const spanTiempo = document.getElementById("tiempo");
                    if (data.segundos !== undefined) {
                        spanTiempo.innerText = data.segundos;
                    }
                }
            } catch (error) {
                console.error("Error al procesar el mensaje:", error);
            }
        };

        ws.onclose = () => {
            console.log("Desconectado de Streamer.bot. Reintentando...");
            setTimeout(() => {
                location.reload();
            }, 3000);
        };
    </script>

</body>
</html>
